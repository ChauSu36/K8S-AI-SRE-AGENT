name: Build and Deploy AI-SRE Agent

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            chausu/k8s-ai-sre-agent:latest
            chausu/k8s-ai-sre-agent:${{ github.sha }}

  update-manifest-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Manifest Repo
        run: |
          git clone https://x-access-token:${{ secrets.AUTO_DEPLOY_TOKEN }}@github.com/ChauSu36/hybrid-cloud-k8s-manifests.git manifest-repo

      - name: Update Image Tag in OpenStack Deployment
        run: |
          cd manifest-repo
          sed -i 's|image: chausu/k8s-ai-sre-agent:.*|image: chausu/k8s-ai-sre-agent:${{ github.sha }}|g' openstack-onpremise/ai-sre-agent/deployment.yaml
          git add openstack-onpremise/ai-sre-agent/deployment.yaml
          git commit -m "ci(ai-sre): update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main
